<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Wise (Demo)</title>

  <!-- NOTE: Serve this file over http(s) (not file://) for OneTrust to work reliably -->

  <!-- OneTrust Cookies Consent Notice start for wise.com (TEST CDN) -->
  <script
    src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js"
    type="text/javascript"
    charset="UTF-8"
    data-domain-script="019e40f8-da69-71f3-a641-fa46b761122c-test">
  </script>
  <script type="text/javascript">function OptanonWrapper() { /* OneTrust callback hook */ }</script>
  <!-- OneTrust Cookies Consent Notice end for wise.com -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Avenir Next", "Avenir", Helvetica, Arial, sans-serif;
      background-color: #f2f5f7;
      color: #2e4369;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: #163300; text-decoration: underline; cursor: pointer; }
    a:hover { text-decoration: none; }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 3px solid #9fe870;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .wise-logo img { height: 26px; width: auto; display: block; }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #f2f5f7; }

    .main-wrapper { display: flex; justify-content: center; padding: 48px 16px 80px; }
    .login-card { width: 100%; max-width: 480px; }

    .login-card h1 {
      font-size: 28px;
      font-weight: 700;
      color: #163300;
      text-align: center;
      margin-bottom: 8px;
    }

    .signup-prompt {
      text-align: center;
      font-size: 15px;
      color: #5d7079;
      margin-bottom: 36px;
    }
    .signup-prompt a { color: #163300; font-weight: 600; }

    .form-group { margin-bottom: 24px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #163300;
      margin-bottom: 6px;
    }
    .input-wrapper { position: relative; }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #d5d9dc;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: #163300;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #163300; }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #5d7079;
      display: flex;
      align-items: center;
    }
    .toggle-password:hover { color: #163300; }

    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #163300;
      background: #9fe870;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }
    .login-btn:hover { background: #8cdc56; }
    .login-btn:active { transform: scale(0.98); }

    .trouble-link {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #163300;
      margin-bottom: 32px;
    }

    .social-divider { font-size: 14px; color: #5d7079; margin-bottom: 16px; }
    .social-buttons { display: flex; gap: 12px; }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
      border: 2px solid #d5d9dc;
      border-radius: 50px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .social-btn:hover { border-color: #163300; background: #f8faf7; }
    .social-btn svg { width: 24px; height: 24px; }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #5d7079;
      margin-top: 40px;
      line-height: 1.6;
    }
    .footer-text a { color: #5d7079; }

    /* ===== OneTrust: try to mimic Wise bottom modal ===== */
    #onetrust-banner-sdk {
      left: 50% !important;
      transform: translateX(-50%) !important;
      bottom: 24px !important;
      right: auto !important;
      width: min(980px, calc(100% - 32px)) !important;
      max-width: 980px !important;
      border-radius: 20px !important;
      box-shadow: 0 18px 48px rgba(16, 24, 40, 0.22) !important;
      overflow: hidden !important;
    }
    #onetrust-banner-sdk .ot-sdk-container { padding: 20px 24px !important; }
    #onetrust-banner-sdk h3, #onetrust-banner-sdk h4 { color: #163300 !important; font-weight: 800 !important; }
    #onetrust-banner-sdk p { color: #5d7079 !important; }
    #onetrust-accept-btn-handler, #onetrust-reject-all-handler, .save-preference-btn-handler {
      border-radius: 999px !important;
      font-weight: 700 !important;
      padding: 10px 18px !important;
    }
    #onetrust-accept-btn-handler { background: #9fe870 !important; color: #163300 !important; border: 2px solid #163300 !important; }
    #onetrust-reject-all-handler { background: #fff !important; color: #163300 !important; border: 2px solid #163300 !important; }

    /* ===== Debug badge ===== */
    .ot-debug {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 999999;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d5d9dc;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: #163300;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.14);
      display: none;
      max-width: 420px;
      line-height: 1.35;
    }
    .ot-debug strong { display:block; margin-bottom:6px; }
    .ot-debug code { background:#f2f5f7; padding:2px 6px; border-radius:6px; }
    .ot-debug .row { margin-top: 6px; }
    .ot-debug button {
      margin-top: 8px;
      background: #163300;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="wise-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Wise_Logo_512x124.svg/1280px-Wise_Logo_512x124.svg.png" alt="Wise" />
    </div>
    <button class="close-btn" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.5" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="main-wrapper">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="signup-prompt">New to Wise? <a href="#">Sign up</a></p>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Your email address</label>
          <input type="email" id="email" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Your password</label>
          <div class="input-wrapper">
            <input type="password" id="password" autocomplete="current-password" />
            <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePassword()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3.5"/>
                <line id="eye-slash" x1="4" y1="4" x2="20" y2="20" style="display:none;"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">Log in</button>
      </form>

      <a href="#" class="trouble-link">Trouble logging in?</a>

      <p class="social-divider">Or log in with</p>
      <div class="social-buttons">
        <button class="social-btn" aria-label="Log in with Google">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </button>
        <button class="social-btn" aria-label="Log in with Facebook">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97H15.83c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          </svg>
        </button>
        <button class="social-btn" aria-label="Log in with Apple">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#000000">
            <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
        </button>
      </div>

      <p class="footer-text">By registering, you accept our <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>

  <div class="ot-debug" id="otDebug">
    <strong>OneTrust banner not detected</strong>
    <div class="row" id="otDebugMsg"></div>
    <button type="button" id="otDebugBtn">Open OneTrust Preferences</button>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeSlash = document.getElementById('eye-slash');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeSlash.style.display = 'block';
      } else {
        passwordInput.type = 'password';
        eyeSlash.style.display = 'none';
      }
    }

    // OneTrust debug helper
    (function () {
      const debugEl = document.getElementById('otDebug');
      const msgEl = document.getElementById('otDebugMsg');
      const btnEl = document.getElementById('otDebugBtn');

      function show(msg) {
        msgEl.innerHTML = msg;
        debugEl.style.display = 'block';
      }

      function tryOpenPrefs() {
        const fns = [
          () => window.OneTrust && window.OneTrust.ToggleInfoDisplay && window.OneTrust.ToggleInfoDisplay(),
          () => window.Optanon && window.Optanon.ToggleInfoDisplay && window.Optanon.ToggleInfoDisplay(),
          () => window.Optanon && window.Optanon.ShowPreferenceCenter && window.Optanon.ShowPreferenceCenter(),
        ];
        for (const fn of fns) {
          try { fn(); return; } catch (e) {}
        }
        alert('OneTrust did not load yet. Check Console/Network for cookielaw requests.');
      }
      btnEl.addEventListener('click', tryOpenPrefs);

      // Detect common causes and also surface OneTrust script load failure
      window.addEventListener('load', () => {
        setTimeout(() => {
          const hasBanner = !!document.getElementById('onetrust-banner-sdk');
          const hasOtApi = !!(window.OneTrust || window.Optanon);

          // If banner exists, do nothing
          if (hasBanner) return;

          const isFile = location.protocol === 'file:';
          const host = location.host || '(no host)';
          const proto = location.protocol;

          const scriptEl = document.querySelector('script[src*="cdn.cookielaw.org/scripttemplates/otSDKStub.js"]');
          const scriptSrc = scriptEl ? scriptEl.src : '(missing script tag)';

          const reasons = [];
          reasons.push(`OneTrust script src: <code>${scriptSrc}</code>`);

          if (isFile) {
            reasons.push('You are running on <code>file://</code>. Serve via <code>http(s)://</code> (e.g. <code>python -m http.server 8080</code>).');
          }

          reasons.push('If DevTools → Network shows <code>otSDKStub.js</code> as 404/blocked, the banner cannot render (adblock/CSP/network).');
          reasons.push('If <code>otSDKStub.js</code> loads (200) but subsequent OneTrust JSON requests 404, your <code>data-domain-script</code> may be wrong OR your current hostname is not allowed for that script.');
          reasons.push('If you have already given consent on this domain, the banner may not re-appear until you clear site data or test in Incognito.');

          show(`Detected protocol: <code>${proto}</code> • Host: <code>${host}</code><br><br>` + reasons.map(r => '• ' + r).join('<br>'));

          if (hasOtApi) setTimeout(tryOpenPrefs, 300);
        }, 1200);
      });

      // Script load error hook
      window.addEventListener('error', (e) => {
        const t = e.target;
        if (t && t.tagName === 'SCRIPT' && (t.src || '').includes('cdn.cookielaw.org')) {
          const msg = `OneTrust script failed to load: <code>${t.src}</code><br>Likely 404/blocked by network/CSP/adblock.`;
          show(msg);
        }
      }, true);
    })();
  </script>
</body>
</html>
