<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Wise (CMP Demo)</title>

  <!--
    WHY IT WAS FAILING BEFORE (and why it works now)
    - OneTrust loads configuration tied to the Domain Script ID (data-domain-script) AND the current hostname.
    - If the Domain Script is not allowed for the hostname you're testing on (localhost / pages / custom domain),
      OneTrust config calls can return HTML/XML (often a 404 page), which then breaks JSON parsing.
    - You confirmed these work in your environment:
        ✅ 019c4ceb-f062-775c-8732-76e319636c35-test  (RewardInsight DS)
        ✅ 019e40f8-da69-71f3-a641-fa46b761122c       (Wise DS - production)
      And previously the Wise *test* DS was used:
        ⚠️ 019e40f8-da69-71f3-a641-fa46b761122c-test

    This file will now:
      1) Prefer the Wise PRODUCTION DS (no -test)
      2) Fall back to Wise TEST DS
      3) Fall back to the RewardInsight working TEST DS
      4) Allow override with ?ds=<id>

    IMPORTANT: Serve over http(s), not file://
  -->

  <script>
    // --- OneTrust DS list (ordered) ---
    const OT_DS_PRIMARY   = '019e40f8-da69-71f3-a641-fa46b761122c-test';   // Wise (test)
    const OT_DS_SECONDARY = '019e40f8-da69-71f3-a641-fa46b761122c';        // Wise (prod) ✅ confirmed working
    const OT_DS_FALLBACK  = '019c4ceb-f062-775c-8732-76e319636c35-test';   // RewardInsight (test) ✅ confirmed working

    (function initOneTrustLoader() {
      const url = new URL(window.location.href);
      const override = (url.searchParams.get('ds') || '').trim();

      const candidates = override
        ? [override]
        : [OT_DS_PRIMARY, OT_DS_SECONDARY, OT_DS_FALLBACK];

      // expose for UI/debug
      window.__OT_DEMO__ = {
        override,
        candidates,
        activeDS: null,
        index: 0,
        tried: [],
        OT_DS_PRIMARY,
        OT_DS_SECONDARY,
        OT_DS_FALLBACK
      };

      // OneTrust calls this when ready
      window.OptanonWrapper = window.OptanonWrapper || function() {};

      function inject(ds) {
        window.__OT_DEMO__.activeDS = ds;
        window.__OT_DEMO__.tried.push(ds);

        // remove prior stub if any
        const old = document.getElementById('ot-sdk-stub');
        if (old) old.remove();

        const s = document.createElement('script');
        s.id = 'ot-sdk-stub';
        s.src = 'https://cdn.cookielaw.org/scripttemplates/otSDKStub.js';
        s.type = 'text/javascript';
        s.charset = 'UTF-8';
        s.setAttribute('data-domain-script', ds);

        // If stub fails to load (blocked/404), try next candidate
        s.addEventListener('error', () => {
          tryNext('OneTrust stub script failed to load');
        });

        document.head.appendChild(s);
      }

      function hasBannerOrAPI() {
        return !!document.getElementById('onetrust-banner-sdk') || !!(window.Optanon || window.OneTrust);
      }

      function tryNext(reason) {
        const state = window.__OT_DEMO__;
        state.lastReason = reason;
        state.index += 1;
        if (state.index >= state.candidates.length) return; // out of candidates
        inject(state.candidates[state.index]);
      }

      // start with first
      inject(candidates[0]);

      // after load, if nothing appeared, attempt next candidate
      window.addEventListener('load', () => {
        // allow some time for OneTrust to fetch config and inject UI
        setTimeout(() => {
          if (!override && !hasBannerOrAPI()) {
            tryNext('No banner/API detected after first DS');
            setTimeout(() => {
              if (!hasBannerOrAPI()) {
                tryNext('No banner/API detected after second DS');
              }
            }, 1600);
          }
        }, 1600);
      });
    })();
  </script>

  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Avenir Next", "Avenir", Helvetica, Arial, sans-serif;
      background-color: #f2f5f7;
      color: #2e4369;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: #163300; text-decoration: underline; cursor: pointer; }
    a:hover { text-decoration: none; }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 3px solid #9fe870;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .wise-logo img { height: 26px; width: auto; display: block; }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #f2f5f7; }

    /* ===== MAIN CONTENT ===== */
    .main-wrapper { display: flex; justify-content: center; padding: 48px 16px 80px; }
    .login-card { width: 100%; max-width: 480px; }

    .login-card h1 {
      font-size: 28px;
      font-weight: 700;
      color: #163300;
      text-align: center;
      margin-bottom: 8px;
    }

    .signup-prompt {
      text-align: center;
      font-size: 15px;
      color: #5d7079;
      margin-bottom: 36px;
    }
    .signup-prompt a { color: #163300; font-weight: 600; }

    /* ===== FORM ===== */
    .form-group { margin-bottom: 24px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #163300;
      margin-bottom: 6px;
    }
    .input-wrapper { position: relative; }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #d5d9dc;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: #163300;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #163300; }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #5d7079;
      display: flex;
      align-items: center;
    }
    .toggle-password:hover { color: #163300; }

    /* ===== LOG IN BUTTON ===== */
    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #163300;
      background: #9fe870;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }
    .login-btn:hover { background: #8cdc56; }
    .login-btn:active { transform: scale(0.98); }

    /* ===== TROUBLE LINK ===== */
    .trouble-link {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #163300;
      margin-bottom: 32px;
    }

    /* ===== SOCIAL LOGIN ===== */
    .social-divider { font-size: 14px; color: #5d7079; margin-bottom: 16px; }
    .social-buttons { display: flex; gap: 12px; }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
      border: 2px solid #d5d9dc;
      border-radius: 50px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .social-btn:hover { border-color: #163300; background: #f8faf7; }
    .social-btn svg { width: 24px; height: 24px; }

    /* ===== FOOTER ===== */
    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #5d7079;
      margin-top: 40px;
      line-height: 1.6;
    }
    .footer-text a { color: #5d7079; }

    /* ===== OneTrust: ensure layers always appear above everything (from RewardInsight working file) ===== */
    #onetrust-banner-sdk,
    #onetrust-consent-sdk {
      z-index: 2147483647 !important;
    }

    /* ===== OneTrust: style banner as center-bottom modal ===== */
    #onetrust-banner-sdk {
      left: 50% !important;
      transform: translateX(-50%) !important;
      bottom: 24px !important;
      right: auto !important;
      width: min(980px, calc(100% - 32px)) !important;
      max-width: 980px !important;
      border-radius: 20px !important;
      box-shadow: 0 18px 48px rgba(16, 24, 40, 0.22) !important;
      overflow: hidden !important;
    }
    #onetrust-banner-sdk .ot-sdk-container { padding: 20px 24px !important; }
    #onetrust-banner-sdk h3, #onetrust-banner-sdk h4 { color: #163300 !important; font-weight: 800 !important; }
    #onetrust-banner-sdk p { color: #5d7079 !important; }
    #onetrust-accept-btn-handler, #onetrust-reject-all-handler, .save-preference-btn-handler {
      border-radius: 999px !important;
      font-weight: 700 !important;
      padding: 10px 18px !important;
    }
    #onetrust-accept-btn-handler { background: #9fe870 !important; color: #163300 !important; border: 2px solid #163300 !important; }
    #onetrust-reject-all-handler { background: #fff !important; color: #163300 !important; border: 2px solid #163300 !important; }

    /* ===== Demo utility chip ===== */
    .cookie-chip {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 200;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d5d9dc;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.14);
      font-size: 13px;
      color: #163300;
    }
    .cookie-chip .pill { font-weight: 700; }
    .cookie-chip button {
      background: #163300;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .cookie-chip button:hover { opacity: 0.92; }
    .cookie-chip .meta {
      font-size: 12px;
      color: #5d7079;
      margin-left: 4px;
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Small toast for DS switching ===== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      z-index: 250;
      background: rgba(22, 51, 0, 0.92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.22);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="wise-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Wise_Logo_512x124.svg/1280px-Wise_Logo_512x124.svg.png" alt="Wise" />
    </div>
    <button class="close-btn" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#163300" stroke-width="2.5" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="main-wrapper">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="signup-prompt">New to Wise? <a href="#">Sign up</a></p>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Your email address</label>
          <input type="email" id="email" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Your password</label>
          <div class="input-wrapper">
            <input type="password" id="password" autocomplete="current-password" />
            <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePassword()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3.5"/>
                <line id="eye-slash" x1="4" y1="4" x2="20" y2="20" style="display:none;"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">Log in</button>
      </form>

      <a href="#" class="trouble-link">Trouble logging in?</a>

      <p class="social-divider">Or log in with</p>
      <div class="social-buttons">
        <button class="social-btn" aria-label="Log in with Google">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </button>
        <button class="social-btn" aria-label="Log in with Facebook">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97H15.83c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          </svg>
        </button>
        <button class="social-btn" aria-label="Log in with Apple">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#000000">
            <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
        </button>
      </div>

      <p class="footer-text">By registering, you accept our <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>

  <div class="cookie-chip" aria-label="Cookie preferences shortcut">
    <span class="pill">Demo</span>
    <button type="button" onclick="openCookiePreferences()">Cookie Preferences</button>
    <span class="meta" id="dsMeta"></span>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // Safe opener (same approach as RewardInsight.html)
    window.openCookiePreferences = function () {
      if (typeof Optanon !== "undefined" && typeof Optanon.ToggleInfoDisplay === "function") {
        Optanon.ToggleInfoDisplay();
      } else if (typeof OneTrust !== "undefined" && typeof OneTrust.ToggleInfoDisplay === "function") {
        OneTrust.ToggleInfoDisplay();
      } else {
        alert("Cookie preference center isn't ready yet. Try again in a moment.");
      }
    };

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeSlash = document.getElementById('eye-slash');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeSlash.style.display = 'block';
      } else {
        passwordInput.type = 'password';
        eyeSlash.style.display = 'none';
      }
    }

    // UI meta + tiny toast when DS switches
    (function() {
      const meta = document.getElementById('dsMeta');
      const toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.style.display = 'none', 2200);
      }

      // Update DS label periodically (because DS may change via fallback loader)
      let last = null;
      setInterval(() => {
        const st = window.__OT_DEMO__;
        if (!st) return;
        if (st.activeDS !== last) {
          last = st.activeDS;
          meta.textContent = `DS: ${st.activeDS}`;
          if (!st.override && st.tried.length > 1) {
            showToast(`OneTrust DS fallback → ${st.activeDS}`);
          }
        }
      }, 400);
    })();
  </script>
</body>
</html>
